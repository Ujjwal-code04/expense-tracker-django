{% extends 'base.html' %}
{% block content %}

<h2 style="text-align:center; margin:30px 0;">
    Expense Charts (Category-wise)
</h2>

<div style="width:50%; margin:0 auto;">
    <canvas id="expenseChart"></canvas>
</div>
<div style="width:50%; margin:0 auto;">
    <canvas id="barChart"></canvas>
</div>

<!-- Chart.js CDN -->
 
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Safely pass Django data -->

{{ labels|json_script:"labels-data" }}
{{ values|json_script:"values-data" }}

<script>
const labels = JSON.parse(
    document.getElementById('labels-data').textContent
);
const values = JSON.parse(
    document.getElementById('values-data').textContent
);

new Chart(document.getElementById('pieChart'), {
    type: 'pie',
    data: {
        labels: labels,
        datasets: [{
            data: values
        }]
    }
});

// BAR CHART
new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{
            label: 'Total Expense',
            data: values
        }]
    },
    options: {
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
</script>

{% endblock %}
