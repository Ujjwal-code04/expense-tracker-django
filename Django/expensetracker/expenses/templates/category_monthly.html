{% extends 'base.html' %}

{% block content %}

<h2 style="text-align:center; margin:30px 0;">
    Category-wise Monthly Report
</h2>

<table class="expense-table">
    <tr>
        <th>Month</th>
        <th>Category</th>
        <th>Total Amount</th>
    </tr>

    {% for item in report %}
    <tr>
        <td>{{ item.month|date:"F Y" }}</td>
        <td>{{ item.category }}</td>
        <td>₹ {{ item.total }}</td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">No data available</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
